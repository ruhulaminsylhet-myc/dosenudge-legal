name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install -g firebase-tools
      - run: npm ci
        working-directory: tests
      - name: Run rules tests against the emulator
        run: firebase emulators:exec --only firestore --project demo-taxi "cd tests && npx vitest run"

  admin-panel:
    name: Admin panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin_panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin_panel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  flutter:
    name: Flutter (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [driver_app, rider_app]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # firebase_options.dart is generated per-environment by flutterfire and is
      # gitignored, so CI stubs it to keep `analyze` self-contained.
      - name: Stub firebase_options.dart
        working-directory: apps/${{ matrix.app }}
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
                  apiKey: 'ci-stub',
                  appId: 'ci-stub',
                  messagingSenderId: 'ci-stub',
                  projectId: 'ci-stub',
                );
          }
          EOF
      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze
